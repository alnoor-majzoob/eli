name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  UV_VERSION: "0.12.21"
  PNPM_VERSION: "11.19.0"

jobs:
  backend:
    name: Backend — lint, types, tests, contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --frozen --extra dev
      - name: Ruff
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        working-directory: apps/api
        run: uv run mypy eil
      - name: Pytest
        working-directory: apps/api
        run: uv run pytest -q
      - name: Security scan (plan Phase 9, T9.2)
        working-directory: apps/api
        run: uv run ../../scripts/security_scan.py
      - name: AI eval gate (plan Phase 4, T4.13, Phase 9 T9.1)
        working-directory: apps/api
        run: uv run python scripts/ai_evals.py
      - name: OpenAPI contract drift
        working-directory: apps/api
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../../packages/api-client/openapi.json

  frontend:
    name: Frontend — lint, types, tests, build, client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Regenerate API client
        run: pnpm --filter @eil/api-client generate
      - name: Generated client drift
        run: git diff --exit-code -- packages/api-client/src/schema.d.ts packages/api-client/openapi.json
      - name: ESLint
        run: pnpm --filter @eil/web lint
      - name: Prettier
        run: pnpm exec prettier --check "apps/web/**/*.{ts,tsx,css,json,md}" "packages/**/*.{ts,json}"
      - name: TypeScript
        run: pnpm --filter @eil/web typecheck
      - name: Vitest
        run: pnpm --filter @eil/web test
      - name: Build
        run: pnpm --filter @eil/web build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen --extra dev
      - name: Install Playwright Chromium
        run: pnpm --filter @eil/web exec playwright install --with-deps chromium
      - name: Run smoke test
        run: pnpm --filter @eil/web e2e

  images:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            tag: eil-api:ci
          - name: web
            dockerfile: apps/web/Dockerfile
            tag: eil-web:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
