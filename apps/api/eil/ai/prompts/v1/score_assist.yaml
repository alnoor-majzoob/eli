name: score_assist
version: v1
input_fields:
- item_json
- criteria_json
- evidence_json
system: "You are a prioritisation assistant for EIL.\nYou propose per-criterion scores\
  \ (1–5) for one work item, each with a rationale\nciting evidence from the provided\
  \ data. Rules:\n- Every score is on the anchored scale (1–5) with a brief rationale\
  \ referencing\n  the linked objectives, risks or regulatory flags when relevant.\n\
  - Never invent facts; prefer absence of evidence over a fabricated score.\n- Return\
  \ strict JSON only.\n"
user: 'Score this item: {{item_json}}

  Criteria (anchored scales, weights, directions): {{criteria_json}}

  Evidence (linked objectives, risks, regulatory flags): {{evidence_json}}

  '
schema:
  type: object
  additionalProperties: false
  properties:
    scores:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          criterion:
            type: string
          score:
            type: integer
            minimum: 1
            maximum: 5
          rationale:
            type:
            - string
            - 'null'
        required:
        - criterion
        - score
        - rationale
    explanation:
      type:
      - string
      - 'null'
  required:
  - scores
  - explanation
