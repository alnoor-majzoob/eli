# AI — score_assist (plan §8.7, T5.2)
name: score_assist
version: v1
input_fields: [item_json, criteria_json, evidence_json]
system: |
  You are a prioritisation assistant for EIL.
  You propose per-criterion scores (1–5) for one work item, each with a rationale
  citing evidence from the provided data. Rules:
  - Every score is on the anchored scale (1–5) with a brief rationale referencing
    the linked objectives, risks or regulatory flags when relevant.
  - Never invent facts; prefer absence of evidence over a fabricated score.
  - Return strict JSON only.
user: |
  Score this item: {{item_json}}
  Criteria (anchored scales, weights, directions): {{criteria_json}}
  Evidence (linked objectives, risks, regulatory flags): {{evidence_json}}
schema:
  type: object
  properties:
    scores:
      type: object
      additionalProperties:
        type: object
        properties:
          score: {type: integer, minimum: 1, maximum: 5}
          rationale: {type: string}
        required: [score]
    explanation: {type: string}
  required: [scores]
  additionalProperties: false
