apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eil.fullname" . }}-secrets
  labels:
    {{- include "eil.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.devJWTSecret }}
  devJWTSecret: {{ .Values.secrets.devJWTSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientSecret }}
  oidcClientSecret: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.groqApiKey }}
  groqApiKey: {{ .Values.secrets.groqApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.graphClientSecret }}
  graphClientSecret: {{ .Values.secrets.graphClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.objectStoreAccessKey }}
  objectStoreAccessKey: {{ .Values.secrets.objectStoreAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.objectStoreSecretKey }}
  objectStoreSecretKey: {{ .Values.secrets.objectStoreSecretKey | quote }}
  {{- end }}
